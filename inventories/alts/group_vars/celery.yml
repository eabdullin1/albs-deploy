---

broker_type: rabbitmq
logs_uploader_type: pulp
terraform_plugin_cache_dir: /home/{{ test_system_user }}/.terraform.d/plugins-cache
test_system_user: test-system
test_system_vhost: test_system
test_system_password: some-another-secret-password
test_system_config_dir: /home/{{ test_system_user }}/.config/alts

rabbitmq_host: localhost
rabbitmq_port: 5672
rabbitmq_ssl_port: 5671

celery_ssl: true
celery_ssl_src_certificate: "files/alts/celery/client_certificate.pem"
celery_ssl_src_key: "files/alts/celery/client_key.pem"
celery_src_cacert: "files/alts/celery/ca_certificate.pem"
celery_ssl_dir: "{{ test_system_config_dir }}/ssl"
celery_ssl_certificate: "{{ celery_ssl_dir }}/{{ celery_ssl_src_certificate | basename }}"
celery_ssl_key: "{{ celery_ssl_dir }}/{{ celery_ssl_src_key | basename }}"
celery_cacert: "{{ celery_ssl_dir }}/{{ celery_src_cacert | basename }}"

result_backend_name: local
celery_result_folder: /srv/celery_results
celery_pool_type: prefork

worker_prefetch_multiplier: 1
result_expires: 3600
tests_exec_timeout: 3600
broker_pool: 30

# Optional overrides for environment provisioning
# cleanup_yum_conf_docs_settings: false
# ignore_ansible_install_errors: true

# Init images (systemd as PID 1) of the docker environments, the only
# source of them in ALTS: "<dist_name>-<dist_version>" of the task, or
# "<dist_name>-<dist_version>-<dist_arch>" for one architecture. A task
# of a platform missing here fails. The tags are multi-arch, linux/386
# included, so i686 tasks on x86_64 workers get native i386 images
docker_images:
  almalinux-8: "almalinux/8-init:8"
  almalinux-9: "almalinux/9-init:9"
  almalinux-10: "almalinux/10-init:10"
  almalinux-10-kitten: "almalinux/10-kitten-init:10-kitten"

celery_log_file_dir: /var/log/celery
celery_log_file: "{{ celery_log_file_dir }}/celery.log"
celery_concurrency: 10
celery_loglevel: INFO
celery_queues:
  - "docker-x86_64-0"
