---

- name: Check if it's a clean installation
  stat:
    path: "{{ volumes_root }}/is_clean_installation"
  register: is_clean_installation

# Pulp runs as a multi-container stack: pulpcore-manager lives in the pulp_api
# service. The init admin password is seeded to "password" by the
# pulp_set_init_password one-shot in docker-compose; this resets it to the
# configured pulp_password if a custom one was provided. The separate postgres
# service already allows external access over the compose network (scram-sha-256
# via pulp-postgres.env), so no manual pg_hba/postgresql.conf edits are needed.
- name: Change pulp password
  community.docker.docker_container_exec:
    container: "{{ container_name_prefix }}_pulp_api_1"
    command: "bash -c 'pulpcore-manager reset-admin-password -p {{ pulp_password }}'"
  register: result
  until: result is succeeded
  retries: 10
  delay: 30
  when: is_clean_installation.stat.exists == False

- name: Wait for web_server container to be running
  community.docker.docker_container_info:
    name: "{{ container_name_prefix }}_web_server_1"
  register: web_server_info
  until: >
    web_server_info.container is not none
    and (web_server_info.container.State.Running | bool)
    and not (web_server_info.container.State.Restarting | bool)
  retries: 30
  delay: 10
  when: is_clean_installation.stat.exists == False

- name: Bootstrap permissions
  community.docker.docker_container_exec:
    container: "{{ container_name_prefix }}_web_server_1"
    command: bash -c 'python3 scripts/bootstrap_permissions.py || true'
  when: is_clean_installation.stat.exists == False

- name: Bootstrap repositories
  community.docker.docker_container_exec:
    container: "{{ container_name_prefix }}_web_server_1"
    command: "python3 scripts/bootstrap_repositories.py {{ '-S ' if bootstrap_repositories_no_sync else '' }}-c reference_data/platforms.yaml"
  register: result
  until: result is succeeded
  retries: 2
  delay: 5
  when: is_clean_installation.stat.exists == False

- name: Activate user
  community.docker.docker_container_exec:
    container: "{{ container_name_prefix }}_web_server_1"
    command: bash -c 'python3 scripts/manage_users.py -e base_user@almalinux.org -t AlmaLinux_team --verify --superuser || true'
  when: is_clean_installation.stat.exists == False

# services.yml recreates db and web_server on every run (also with
# '--tags update'), and the scripts below need the DB up and upgraded by
# alembic, which the web server runs before it starts answering HTTP. Any
# answer will do: /roles/ without a token is 401.
- name: Wait for the web server to answer HTTP
  tags:
    - jwt_tokens
    - update
    - albs_jwt_token
  ansible.builtin.uri:
    url: "{{ albs_deploy_api_url }}roles/"
    method: GET
    status_code: [200, 401, 403]
  register: web_server_http
  until: web_server_http.status | default(-1) in [200, 401, 403]
  retries: 60
  delay: 5
  changed_when: false

# The JWT initially generated in common.yml uses a guessed user_id and is
# only there so the first config render isn't empty. Now that the base
# user actually exists in the DB, regenerate the JWT via the web_server
# helper so it carries the real id and a fresh expiry, then re-render
# the configs and recreate the consumer containers.
- name: Regenerate ALBS JWT for the real base_user
  tags:
    - jwt_tokens
    - update
    - albs_jwt_token
  community.docker.docker_container_exec:
    container: "{{ container_name_prefix }}_web_server_1"
    command: >-
      bash -c 'python3 scripts/generate_token.py
      -e base_user@almalinux.org -s "{{ albs_jwt_secret }}"
      | grep -E "^eyJ" | tail -n 1'
  register: regenerated_albs_jwt

- name: Update albs_jwt fact with regenerated token
  tags:
    - jwt_tokens
    - update
    - albs_jwt_token
  set_fact:
    albs_jwt: "{{ regenerated_albs_jwt.stdout | trim }}"
  when:
    - regenerated_albs_jwt is defined
    - regenerated_albs_jwt.stdout | default('') | trim | length > 0

# Sets albs_build_node_jwt, the token of build_node.yml.j2; fails without it.
# Not needed when the build_node container isn't deployed (a separate node).
- name: Get the token of the build nodes
  tags:
    - jwt_tokens
    - update
    - albs_jwt_token
  ansible.builtin.include_tasks:
    file: build_node_token.yml
    apply:
      tags:
        - jwt_tokens
        - update
        - albs_jwt_token
  when: "'build_node' not in excluded_containers | default([])"

# A build_node container started without its config (by hand, or by a run of
# an older version of the role) makes docker create a directory in place of the
# config file, and the template would silently write the config inside of it.
# An empty directory is removed, anything else is left for a human.
- name: Check what is in place of the build node config
  tags:
    - jwt_tokens
    - update
    - albs_jwt_token
  ansible.builtin.stat:
    path: "{{ build_node_config_path }}"
  register: build_node_config_stat
  when: albs_build_node_jwt is defined

- name: Remove the directory left in place of the build node config
  tags:
    - jwt_tokens
    - update
    - albs_jwt_token
  when:
    - albs_build_node_jwt is defined
    - build_node_config_stat.stat.exists
    - build_node_config_stat.stat.isdir
  block:
    - name: Look into the directory in place of the build node config
      ansible.builtin.find:
        paths: "{{ build_node_config_path }}"
        file_type: any
        hidden: true
      register: build_node_config_dir

    - name: Fail if the directory in place of the build node config isn't empty
      ansible.builtin.fail:
        msg: >-
          {{ build_node_config_path }} is a directory with files in it, while
          it has to be the config file of the build node: docker creates the
          directory when the build_node container is started without the
          config. Stop the build_node container, remove the directory and run
          the playbook again.
      when: build_node_config_dir.matched > 0

    - name: Remove the empty directory in place of the build node config
      ansible.builtin.file:
        path: "{{ build_node_config_path }}"
        state: absent

- name: Re-render service configs with regenerated JWT
  tags:
    - jwt_tokens
    - update
    - albs_jwt_token
    - configs
  template:
    dest: "{{ item.dest }}/{{ item.dname }}"
    src: "{{ item.sname }}"
    mode: "{{ item.mode }}"
    force: yes
  with_items: "{{ generated_configs }}"
  # The build node config doesn't use albs_jwt: it's rendered whenever the
  # build node token is there and only then (configs.yml skips it), so the
  # build_node container below never starts without its config.
  when: >-
    (item.sname == 'build_node.yml.j2' and albs_build_node_jwt is defined)
    or (item.sname != 'build_node.yml.j2'
        and regenerated_albs_jwt is defined
        and regenerated_albs_jwt.stdout | default('') | length > 0)

# Recreate all non-excluded consumer containers in a single compose invocation
# (parallel, depends_on-ordered) instead of a per-service loop. The filtered list
# is guarded so an empty arg list never makes 'docker compose up' touch ALL
# services (including the excluded ones).
- name: Recreate consumer containers to pick up regenerated JWT
  tags:
    - jwt_tokens
    - update
    - albs_jwt_token
    - services
  vars:
    consumer_services: >-
      {{ services.stdout_lines
         | difference(excluded_containers)
         | difference(pre_bootstrap_excluded_containers | default([]))
         | difference(['build_node']) }}
  shell: >-
    {{ docker_compose }} -p {{ container_name_prefix }} --compatibility
    up -d --force-recreate {{ consumer_services | join(' ') }}
  args:
    chdir: "{{ sources_root }}/albs-web-server"
  when:
    - regenerated_albs_jwt is defined
    - regenerated_albs_jwt.stdout | default('') | length > 0
    - services is defined
    - consumer_services | length > 0

# build_node is never started before its token is issued (services.yml and
# the consumer containers above leave it out). It's (re)created here, also by
# '--tags update' / 'jwt_tokens' / 'albs_jwt_token' which re-render its
# config: the config is a bind-mounted file and the template replaces it, so
# the running container keeps the old file and token until it's recreated.
# Without the config compose would create a directory in its place, so the
# container isn't started then.
- name: Check that the build node config is rendered
  tags:
    - jwt_tokens
    - update
    - albs_jwt_token
  ansible.builtin.assert:
    that: albs_build_node_jwt is defined
    fail_msg: >-
      There is no build node token (tasks/build_node_token.yml), so the build
      node config isn't rendered and the build_node container isn't started:
      compose would create a directory in place of its config. Don't skip the
      build node token tasks or exclude build_node with excluded_containers.
    quiet: true
  when: "'build_node' not in excluded_containers | default([])"

- name: Recreate the build_node container with the build node token
  tags:
    - jwt_tokens
    - update
    - albs_jwt_token
  ansible.builtin.command:
    cmd: >-
      {{ docker_compose | default('docker compose') }}
      -p {{ container_name_prefix }} --compatibility
      up -d --build --force-recreate build_node
    chdir: "{{ sources_root }}/albs-web-server"
  when: "'build_node' not in excluded_containers | default([])"

# The excluded containers stay down, build_node is started above whether
# it's listed here or not. The filtered list is guarded so an empty arg list
# never makes 'docker compose up' start ALL services.
- name: Start containers deferred until after bootstrap
  vars:
    deferred_services: >-
      {{ pre_bootstrap_excluded_containers | default([])
         | difference(excluded_containers | default([]))
         | difference(['build_node']) }}
  shell: >-
    {{ docker_compose }} -p {{ container_name_prefix }} --compatibility
    up -d --build --force-recreate
    {{ deferred_services | join(' ') }}
  args:
    chdir: "{{ sources_root }}/albs-web-server"
  when: deferred_services | length > 0

- name: Checking if GPG key exists on web_server
  tags: add_pgp_to_web_server
  ansible.builtin.uri:
    url: "{{ albs_api_url_ext }}sign-keys/"
    method: GET
    headers:
      accept: application/json
      Authorization: "Bearer {{ albs_jwt }}"
    return_content: true
  register: gpg_request_output
  until: gpg_request_output.status == 200
  retries: 30
  delay: 5

- name: Adding GPG key to the web_server
  tags: add_pgp_to_web_server
  ansible.builtin.uri:
    url: "{{ albs_api_url_ext }}sign-keys/new/"
    method: POST
    headers:
      accept: application/json
      Authorization: "Bearer {{ albs_jwt }}"
      Content-Type: application/json
    body:
      name: Test GPG key
      description: test
      keyid: "{{ gpg_key_fingerprint.stdout[-16:] }}"
      fingerprint: "{{ gpg_key_fingerprint.stdout | trim }}"
      public_url: http://test.com
      platform_id: 1
    body_format: json
    status_code:
      - 200
      - 201
  when: gpg_request_output.json|length == 0

- name: Bootstrap flavours
  community.docker.docker_container_exec:
    container: "{{ container_name_prefix }}_web_server_1"
    command: python3 scripts/manage_flavours.py -c reference_data/platform_flavors.yaml
  when: is_clean_installation.stat.exists == False

- name: ensure file exists
  copy:
    content: ""
    dest: "{{ volumes_root }}/is_clean_installation"
    force: false
